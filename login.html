<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal | Imena Academy</title><link rel="stylesheet" href="css/style.css"></head><body><canvas id="scene"></canvas><div class="noise"></div><nav><a class="brand" href="index.html"><b>IMENA</b><span>ACADEMY RWANDA</span></a><div class="links"><a href="index.html">Home</a><a href="admissions.html">Admissions</a></div><a class="pill" href="index.html">← Home</a></nav>
<main class="auth"><div class="glass auth-card"><div class="tabs"><button class="selected" data-mode="login">Login</button><button data-mode="register">Register</button></div><div id="login"><p class="kicker">STUDENT & FAMILY PORTAL</p><h1>Welcome <em>back.</em></h1><form onsubmit="event.preventDefault();document.querySelector('#msg').textContent='Demo login submitted ✓';"><label>Email<input required type="email" placeholder="you@example.com"></label><label>Password<input required type="password" placeholder="••••••••"></label><button class="btn primary">Sign in →</button></form></div><div id="register" class="hidden"><p class="kicker">NEW ACCOUNT</p><h1>Join <em>Imena.</em></h1><form onsubmit="event.preventDefault();document.querySelector('#msg').textContent='Demo registration submitted ✓';"><label>Full name<input required placeholder="Your name"></label><label>Email<input required type="email" placeholder="you@example.com"></label><label>Password<input required type="password" placeholder="Create a password"></label><button class="btn primary">Create account →</button></form></div><p id="msg"></p></div></main><script>const tabs=document.querySelectorAll('.tabs button');tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('selected'));t.classList.add('selected');document.querySelector('#login').classList.toggle('hidden',t.dataset.mode!=='login');document.querySelector('#register').classList.toggle('hidden',t.dataset.mode!=='register')})</script><script type="module" src="js/scene.js"></script></body></html>
